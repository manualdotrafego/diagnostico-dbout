<style>
:root{
  --bg:#0A0A0B;
  --bg-2:#0F0F11;
  --card:#141417;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);
  --text:#F4F4F5;
  --muted:#A1A1AA;
  --dim:#6B6B74;
  --lime:#C7F94E;
  --lime-2:#B4EB2E;
  --lime-soft:rgba(199,249,78,.10);
  --lime-line:rgba(199,249,78,.45);
  --red:#FF5C5C;
  --r:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--body);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* fundo: brilho lima + grade fina que some nas bordas */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:-20% -10% auto;height:70vh;
  background:radial-gradient(60% 60% at 50% 0%,rgba(199,249,78,.13),transparent 70%);
  transition:transform 1.2s var(--ease),opacity 1.2s var(--ease)}
.bg::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 30%,transparent 75%);
          mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 30%,transparent 75%);opacity:.55}
body.is-impact .bg::before{transform:scale(1.25);opacity:1;
  background:radial-gradient(60% 60% at 50% 0%,rgba(199,249,78,.22),transparent 70%)}

.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  width:100%;max-width:560px;margin:0 auto;padding:0 20px calc(28px + env(safe-area-inset-bottom))}

/* topo */
.top{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 0 14px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.logo{height:19px;width:auto;display:block;opacity:.95}
.back{appearance:none;border:0;background:none;color:var(--muted);font:500 13px var(--body);
  display:inline-flex;align-items:center;gap:6px;padding:8px 10px 8px 0;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s,color .2s}
.back.on{opacity:1;pointer-events:auto}
.back:hover{color:var(--text)}
.back svg{width:16px;height:16px}
.counter{font:600 12px var(--body);letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .3s}
.counter.on{opacity:1}
.counter b{color:var(--text);font-weight:600}
.bar{display:grid;grid-auto-flow:column;gap:5px;margin-top:12px;opacity:0;transition:opacity .4s}
.bar.on{opacity:1}
.seg{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:4px;
  transition:width .55s var(--ease);box-shadow:0 0 12px rgba(199,249,78,.6)}
.seg.done i{width:100%}

/* telas */
.stage{position:relative;flex:1;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;flex:1;padding-top:18px;
  animation:enter .5s var(--ease) both}
.screen.leaving{animation:leave .28s ease both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-10px)}}
.reveal{animation:enter .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 80ms)}

.kicker{display:inline-flex;align-items:center;gap:8px;font:600 11.5px var(--body);letter-spacing:.14em;
  text-transform:uppercase;color:var(--lime);margin-bottom:14px}
.kicker::before{content:"";width:18px;height:1.5px;background:var(--lime)}
h1,h2{font-family:var(--display);letter-spacing:-.03em;color:var(--text)}
h1{font-weight:800;font-size:clamp(34px,8.6vw,48px);line-height:1.02}
h2{font-weight:700;font-size:clamp(25px,6.6vw,32px);line-height:1.1}
.hl{color:var(--lime)}
.lead{color:var(--muted);font-size:16px;line-height:1.55;margin-top:14px}
.lead strong{color:var(--text);font-weight:600}

/* intro */
.pill{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;padding:7px 13px 7px 11px;
  border:1px solid var(--line-2);border-radius:999px;background:rgba(255,255,255,.03);
  font:500 12.5px var(--body);color:var(--muted);margin-bottom:22px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(199,249,78,.6);
  animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(199,249,78,.55)}70%{box-shadow:0 0 0 9px rgba(199,249,78,0)}100%{box-shadow:0 0 0 0 rgba(199,249,78,0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px 12px;background:rgba(255,255,255,.02)}
.stat b{display:block;font:800 22px var(--display);letter-spacing:-.02em;color:var(--text)}
.stat b em{font-style:normal;color:var(--lime)}
.stat span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.3}
.clients{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--dim);font-size:12px}
.clients .logos{display:flex}
.clients img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);
  margin-left:-8px;filter:grayscale(1) contrast(1.05);background:#fff}
.clients img:first-child{margin-left:0}

/* botões */
.foot{margin-top:auto;padding-top:26px}
.btn{appearance:none;border:0;width:100%;height:58px;border-radius:15px;cursor:pointer;
  background:var(--lime);color:#0A0A0B;font:700 17px var(--display);letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;
  box-shadow:0 14px 34px -14px rgba(199,249,78,.65),inset 0 -2px 0 rgba(0,0,0,.12);
  transition:transform .15s var(--ease),box-shadow .25s,opacity .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 3.6s 1.2s infinite}
@keyframes shine{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.btn svg{width:19px;height:19px;transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:disabled::after{display:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost::after{display:none}
.micro{text-align:center;color:var(--dim);font-size:12.5px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.micro svg{width:13px;height:13px}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:10px}
h1:focus,h2:focus,h1:focus-visible,h2:focus-visible{outline:none}

/* opções */
.q-head{margin-bottom:24px}
.q-head .lead{font-size:15px;margin-top:10px}
.opts{display:grid;gap:10px}
.opt{appearance:none;width:100%;text-align:left;cursor:pointer;color:var(--text);font:500 16px var(--body);
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  padding:15px 16px;min-height:62px;border-radius:var(--r);border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  transition:border-color .2s,background .2s,transform .18s var(--ease)}
.opt:hover{border-color:rgba(199,249,78,.38);transform:translateY(-1px)}
.opt .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);transition:all .2s}
.opt .ico svg{width:19px;height:19px}
.opt .txt small{display:block;color:var(--dim);font-size:12.5px;font-weight:400;margin-top:2px}
.opt .key{width:24px;height:24px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;
  font:600 11px var(--body);color:var(--dim);transition:all .2s}
.opt.sel{border-color:var(--lime);background:linear-gradient(180deg,rgba(199,249,78,.13),rgba(199,249,78,.05))}
.opt.sel .ico{background:var(--lime);color:#0A0A0B;border-color:var(--lime)}
.opt.sel .key{background:var(--lime);border-color:var(--lime);color:#0A0A0B}
.opt.sel .key span{display:none}
.opt.sel .key::after{content:"";width:10px;height:6px;border-left:2px solid #0A0A0B;border-bottom:2px solid #0A0A0B;transform:rotate(-45deg) translate(1px,-1px)}
.opts.locked .opt:not(.sel){opacity:.45}

/* cadeiras visuais */
.chairs{display:flex;gap:3px;align-items:center}
.chairs i{width:7px;height:16px;border-radius:2.5px;background:var(--lime);opacity:.9}
.chairs i.g{background:transparent;border:1.5px dashed rgba(199,249,78,.55)}
.chairs b{font:700 13px var(--display);color:var(--lime);margin-left:3px}
.opt.sel .chairs i{background:#0A0A0B}
.opt.sel .chairs i.g{border-color:#0A0A0B;background:transparent}
.opt.sel .chairs b{color:#0A0A0B}

/* campos */
.field{display:block;margin-bottom:14px}
.field label{display:block;font:500 13px var(--body);color:var(--muted);margin-bottom:8px}
.field input{width:100%;height:56px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);
  color:var(--text);font:500 17px var(--body);padding:0 16px;outline:none;transition:border-color .2s,background .2s}
.field input::placeholder{color:#55555c}
.field input:focus{border-color:var(--lime);background:rgba(199,249,78,.04)}
.field.err input{border-color:var(--red)}
.field .msg{display:none;color:var(--red);font-size:12.5px;margin-top:7px}
.field.err .msg{display:block}

/* impacto */
.impact-tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:7px 12px;border-radius:999px;
  background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);color:#FF8A8A;font:600 12px var(--body);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.impact-tag svg{width:14px;height:14px}
.big{font:800 clamp(92px,28vw,132px)/.9 var(--display);letter-spacing:-.06em;color:var(--lime);
  text-shadow:0 0 60px rgba(199,249,78,.35);font-variant-numeric:tabular-nums;margin:6px 0 10px}
.big small{font-size:.42em;letter-spacing:-.02em;margin-left:4px}
.src{color:var(--dim);font-size:12px;margin-top:10px}
.card{margin-top:22px;border:1px solid var(--line-2);border-radius:18px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lime)}
.card .label{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.card .hours{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.card .hours b{font:800 40px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card .hours span{color:var(--muted);font-size:14px}
.card p{color:var(--muted);font-size:14.5px;line-height:1.5}
.card p strong{color:var(--text);font-weight:600}

/* análise */
.analyze{align-items:center;text-align:center;justify-content:center}
.ring{position:relative;width:168px;height:168px;margin:10px auto 26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.07)}
.ring .pr{stroke:var(--lime);filter:drop-shadow(0 0 8px rgba(199,249,78,.55))}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 40px var(--display);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .pct small{font-size:20px;color:var(--lime);margin:8px 0 0 2px}
.checks{list-style:none;display:grid;gap:10px;margin-top:22px;text-align:left;width:100%}
.checks li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;
  color:var(--dim);font-size:14.5px;transition:all .35s}
.checks li .c{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;transition:all .3s}
.checks li.ok{color:var(--text);border-color:rgba(199,249,78,.25);background:rgba(199,249,78,.04)}
.checks li.ok .c{background:var(--lime);border-color:var(--lime)}
.checks li.ok .c::after{content:"";width:9px;height:5px;border-left:2px solid #0A0A0B;border-bottom:2px solid #0A0A0B;transform:rotate(-45deg) translate(1px,-1px)}
.checks li.run .c{border-color:var(--lime);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* resultado */
.phase-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:20px 0 8px}
.phase{border-radius:12px;padding:11px 10px;border:1px solid var(--line);text-align:center;transition:all .4s}
.phase b{display:block;font:700 14px var(--display);color:var(--dim)}
.phase span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.phase.on{border-color:var(--lime);background:var(--lime-soft);box-shadow:0 0 0 4px rgba(199,249,78,.07)}
.phase.on b{color:var(--lime)}
.phase.on span{color:var(--muted)}
.recs{list-style:none;display:grid;gap:10px;margin-top:20px}
.recs li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
.recs .n{width:26px;height:26px;border-radius:8px;background:var(--lime-soft);border:1px solid var(--lime-line);color:var(--lime);
  font:700 13px var(--display);display:grid;place-items:center}
.recs b{display:block;font:600 15px var(--body);margin-bottom:3px}
.recs p{color:var(--muted);font-size:13.5px;line-height:1.5}
.wa{background:#25D366;color:#06210f;box-shadow:0 14px 34px -14px rgba(37,211,102,.7)}
.ok-note{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:13px 14px;border-radius:13px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--muted);font-size:13.5px;line-height:1.5}
.ok-note svg{width:18px;height:18px;color:var(--lime);flex:none;margin-top:1px}

.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:#0A0A0B;animation:spin .7s linear infinite}

@media (min-width:600px){.app{padding-left:24px;padding-right:24px}.screen{padding-top:34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function go(to, push=true){
  if(busy) return; busy = true;
  const cur = stage.querySelector(".screen");
  const run = () => {
    if(push) hist.push(idx);
    idx = to; render(); busy = false;
    window.scrollTo({top:0, behavior:"smooth"});
  };
  if(cur){ cur.classList.add("leaving"); setTimeout(run, 240); } else run();
}
function next(){ go(idx+1); }
$("#back").addEventListener("click", () => {
  if(!hist.length) return;
  const prev = hist.pop();
  if(STEPS[prev].type === "analyze") { go(hist.pop() ?? 0, false); return; }
  go(prev, false);
});

function chrome(){
  const s = STEPS[idx];
  const pos = COUNTED.indexOf(s.id);
  const show = !["intro","analise","resultado"].includes(s.id);
  $("#counter").classList.toggle("on", show);
  bar.classList.toggle("on", s.id !== "intro");
  $("#back").classList.toggle("on", show && hist.length>0 && s.id !== "cargo" || (s.id==="cargo" && hist.length>0));
  const doneUntil = s.id==="resultado" || s.id==="analise" ? (s.id==="resultado"?COUNTED.length: COUNTED.indexOf("cidade")+1) : pos;
  [...bar.children].forEach((seg,i)=>{
    seg.classList.toggle("done", i < doneUntil);
    seg.querySelector("i").style.width = i < doneUntil ? "100%" : (i===pos ? "35%" : "0");
  });

  document.body.classList.toggle("is-impact", s.type==="impact");
}

function countUp(node, to, ms, fmt){
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / ms); const e = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt ? fmt(Math.round(to * e)) : Math.round(to * e);
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

}

  const f = fase(); const nm = firstName();
  el.innerHTML = `
    <div class="kicker reveal" style="--i:0">Diagnóstico de ${nm || "captação"}</div>
    <h2 class="reveal" style="--i:1">${nm ? nm + ", sua" : "Sua"} clínica está na fase <span class="hl">${f.nome}</span>.</h2>
    <div class="phase-bar reveal" style="--i:2">
      ${[["Base","depende de indicação"],["Retomada","já testou anúncios"],["Escala","anúncio rodando"]].map((p,k)=>`<div class="phase ${k===f.i?"on":""}"><b>${p[0]}</b><span>${p[1]}</span></div>`).join("")}
    </div>
    <p class="lead reveal" style="--i:3">${f.txt}</p>
    <ul class="recs">${recs().map((r,k)=>`<li class="reveal" style="--i:${k+4}"><span class="n">${k+1}</span><div><b>${r[0]}</b><p>${r[1]}</p></div></li>`).join("")}</ul>
    <div class="ok-note reveal" style="--i:7">${svg("check")}<span>Recebemos suas respostas. Um especialista da DBOUT vai te chamar no WhatsApp para aprofundar esse diagnóstico com você.</span></div>
    <div class="foot reveal" style="--i:8">
      <a class="btn wa" href="${WHATS_URL}" target="_blank" rel="noopener" id="wa">${svg("wa", true)} Falar agora com um especialista</a>
    </div>`;
  el.querySelector("#wa").addEventListener("click", () => track("QuizWhatsApp"));
}

render();
</script>
</body>
</html>
